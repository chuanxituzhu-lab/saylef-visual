<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saylef Visual</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">SAYLEF / VISUAL STORY MVP</p>
        <h1>给一个感觉，生成一个安静的故事画面。</h1>
        <p class="lede">固定视觉 DNA，变化诗意、季节与故事瞬间。当前版本输出可交给宿主图片工具执行的任务计划。</p>
      </header>
      <section class="workspace">
        <form id="creator" class="panel controls">
          <label>创作想法<textarea name="user_idea">秋天，一个关于等待的安静故事</textarea></label>
          <label>季节<select name="season"><option value="auto">自动</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label>
          <label>尺寸<select name="ratio"><option>3:4</option><option>4:5</option><option>9:16</option><option>1:1</option><option>16:9</option></select></label>
          <label>情绪提示<input name="emotion_hint" placeholder="可选，例如：归家" /></label>
          <button type="submit">生成 Visual Intent</button>
        </form>
        <section class="panel result" aria-live="polite">
          <div class="result-head"><span>结果</span><span id="status">等待输入</span></div>
          <div id="art" class="art"><span>画面预览占位</span></div>
          <div id="story" class="story"></div>
          <details><summary>Host Invocation Plan</summary><pre id="plan"></pre></details>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
