<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saylef Visual</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" class="lang active" data-language="zh">中文</button>
          <button type="button" class="lang" data-language="en">English</button>
        </div>
        <p class="eyebrow">SAYLEF / VISUAL STORY MVP</p>
        <h1 data-i18n="title">给一个感觉，生成一个安静的故事画面。</h1>
        <p class="lede" data-i18n="lede">固定视觉 DNA，变化诗意、季节与故事瞬间。当前版本输出可交给宿主图片工具执行的任务计划。</p>
      </header>
      <section class="workspace">
        <form id="creator" class="panel controls">
          <input type="hidden" name="language" value="zh" />
          <label><span data-i18n="idea">创作想法</span><textarea name="user_idea">秋天，一个关于等待的安静故事</textarea></label>
          <label><span data-i18n="season">季节</span><select name="season"><option value="auto" data-i18n="auto">自动</option><option value="spring" data-i18n="spring">春</option><option value="summer" data-i18n="summer">夏</option><option value="autumn" data-i18n="autumn">秋</option><option value="winter" data-i18n="winter">冬</option></select></label>
          <label><span data-i18n="ratio">尺寸</span><select name="ratio"><option>3:4</option><option>4:5</option><option>9:16</option><option>1:1</option><option>16:9</option></select></label>
          <label><span data-i18n="emotion">情绪</span><select name="emotion_hint"><option value="" data-i18n="emotionAuto">随季节自动</option><option value="quiet joy" data-i18n="quietJoy">安静的喜悦</option><option value="quiet longing" data-i18n="quietLonging">安静的思念</option><option value="quiet belonging" data-i18n="quietBelonging">安静的归属感</option><option value="quiet waiting" data-i18n="quietWaiting">安静的等待</option><option value="quiet solitude" data-i18n="quietSolitude">安静的独处</option><option value="quiet tenderness" data-i18n="quietTenderness">安静的温柔</option><option value="quiet anticipation" data-i18n="quietAnticipation">安静的期待</option><option value="quiet courage" data-i18n="quietCourage">安静的勇气</option><option value="quiet reunion" data-i18n="quietReunion">安静的重逢</option><option value="quiet farewell" data-i18n="quietFarewell">安静的告别</option><option value="warm guardianship" data-i18n="warmGuardianship">温暖的守候</option><option value="healing serenity" data-i18n="healingSerenity">治愈的宁静</option></select></label>
          <button type="submit" data-i18n="generate">生成 Visual Intent</button>
        </form>
        <section class="panel result" aria-live="polite">
          <div class="result-head"><span data-i18n="result">结果</span><span id="status">等待输入</span></div>
          <div id="art" class="art"><span data-i18n="placeholder">画面预览占位</span></div>
          <div id="story" class="story"></div>
          <section id="prompt-card" class="prompt-card" hidden>
            <div class="prompt-head"><strong data-i18n="prompt">生成提示词</strong><button id="copy-prompt" type="button" class="copy" data-i18n="copy">复制提示词</button></div>
            <pre id="prompt"></pre>
          </section>
          <details><summary data-i18n="plan">宿主调用计划</summary><pre id="plan"></pre></details>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
